# docker-compose.<env>.yml —— 应用编排（参考实现 · 按项目替换配置区）
#
# 官方基准镜像 + 产物挂载（不构建自制镜像，按项目形态替换），文件名中的 <env> 取 DEPLOYMENT §2.1 环境名。
# 发布链挂载：产物经 releases/<时间戳>-<sha>/ + current 软链挂载（发布 = 原子切 current + recreate）。
# 变量替换：同目录 .env（部署机存在，不入库）供 ${VAR}；应用运行配置经 env_file 注入。
# 中间件（如 RAGFlow）不并入本编排——独立 compose 运行，避免两套编排相互重建/牵动。

services:
  backend:
    image: python:3.11-slim
    # 容器名带 commit：docker ps 直接看到本次发布版本（旧名容器由 --remove-orphans 清理）
    container_name: <app>-backend-${BUILD_COMMIT:-unknown}
    working_dir: /app
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # 应用运行配置（<env>/.env.<env>；敏感项可被部署机 .env 覆盖）
    env_file: .env.dev
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-before-production}
      PYTHONPATH: /opt/backend-dist
      BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
      BUILD_TIME: ${BUILD_TIME:-unknown}
    volumes:
      # 代码经 current 软链挂载（指向 releases/<...>/backend，回滚=切软链）
      - ${DEPLOY_ROOT:-/data/<app>}/current/backend:/app
      - ${DEPLOY_ROOT:-/data/<app>}/backend-dist:/opt/backend-dist
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - <app>-net

  frontend:
    image: nginx:1.25-alpine
    container_name: <app>-frontend-${BUILD_COMMIT:-unknown}
    environment:
      BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
      BUILD_TIME: ${BUILD_TIME:-unknown}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    volumes:
      # dist 经 current 软链挂载（指向 releases/<...>/dist）
      - ${DEPLOY_ROOT:-/data/<app>}/current/dist:/usr/share/nginx/html:ro
      - ../../../../frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - <app>-net

networks:
  <app>-net:
    driver: bridge
